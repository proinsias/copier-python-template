[project]
name = "copier-python-template"
version = "0.0.1"
description = "Copier template for my python projects."
license = { text = "Unlicense" }
authors = [{ name = "Francis T. O'Donovan", email = "proinsias@users.noreply.github.com" }]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = []

[dependency-groups]
dev = [
    "copier>=9.14.1",  # CVE-2026-23986
    "pyright>=1.1.275",
    "pytest>=9.0.3",  # CVE-2025-71176
    "yamllint>=1.26.3"
]

[project.urls]
Homepage = "https://github.com/proinsias/copier-python-template"
Repository = "https://github.com/proinsias/copier-python-template"
Documentation = "https://github.com/proinsias/copier-python-template"
"Bug Tracker" = "https://github.com/proinsias/copier-python-template/issues"

[tool.ruff]
# Find and format code blocks in Markdown files
extend-include = ["*.md"]

[tool.ruff.lint]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
select = ["ALL", "I"]
# Allow fix for all enabled rules (when `--fix` is provided)
fixable = ["ALL"]
# Optionally, list rules that should never be fixed automatically
unfixable = []
# CPY001 (missing copyright notice) is categorically inapplicable: this
# project is Unlicense (public domain), so no file carries a copyright
# notice.
ignore = ["CPY001"]

[tool.ruff.lint.per-file-ignores]
# copier-python-template/tests/ ships an __init__.py.jinja that only becomes
# a real tests/__init__.py once copier renders the template, so INP001 is a
# structural artifact of testing the un-rendered template source, not a real
# gap. S101 (assert) is the standard, idiomatic way to write pytest tests.
"copier-python-template/tests/copier_python_template_test.py" = ["INP001", "S101"]

[tool.bandit]

[tool.bandit.assert_used]
# assert is the standard, idiomatic way to write pytest tests.
skips = ["*_test.py"]
